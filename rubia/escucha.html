<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Escucha con Rubia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #ffd9a8; font-family: 'Baloo 2', system-ui, sans-serif; color: #2b2340; overflow: hidden; }
  .stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  .frame { position: relative; width: min(100vw, 177.78vh); aspect-ratio: 16 / 9; background-size: cover; background-position: center; }
  .txt { position: absolute; left: 2%; top: 0; bottom: 0; width: 46%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding-bottom: 6%; }
  .big { font-weight: 800; font-size: min(9.4vw, 16.7vh); line-height: 1.05; color: #ff8a1f; -webkit-text-stroke: min(.9vw, 1.6vh) #4a2208; paint-order: stroke fill; text-shadow: 0 min(.7vw, 1.3vh) 0 #4a2208; }
  .es { font-weight: 700; font-size: min(4.4vw, 7.8vh); color: #1f2a5c; }
  .say { font-weight: 500; font-size: min(2.5vw, 4.4vh); color: #6b4a2a; }
  .say b { font-weight: 700; color: #2b2340; }
  .logo { position: absolute; left: 2%; bottom: 3%; width: 8.5%; aspect-ratio: 1; background: url('img/logo.png') center/contain no-repeat; }
  .overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(43,35,64,.45); padding: 16px; }
  .overlay.on { display: flex; }
  .card { background: #fffaf2; border-radius: 28px; padding: 26px 30px; text-align: center; max-width: 460px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
  .card h2 { font-weight: 800; font-size: 30px; color: #7b3fc4; line-height: 1.1; }
  .card p { font-size: 18px; margin-top: 8px; line-height: 1.35; }
  .btn { display: inline-flex; align-items: center; gap: 10px; margin-top: 16px; background: #7b3fc4; color: #fff; border: 4px solid #fff; border-radius: 999px;
    font: 700 22px 'Baloo 2', system-ui, sans-serif; padding: 10px 28px; box-shadow: 0 5px 0 #4b2382; cursor: pointer; }
  .arrow { display: inline-block; background: #7b3fc4; color: #fff; border-radius: 10px; padding: 0 10px; font-size: 22px; line-height: 1.3; }
  .btn.light { background: #fff; color: #7b3fc4; border-color: #7b3fc4; box-shadow: none; font-size: 18px; padding: 6px 20px; }
  .fab { position: fixed; top: max(14px, env(safe-area-inset-top)); width: 64px; height: 64px; border-radius: 50%; border: 4px solid #fff;
    background: #7b3fc4; color: #fff; font: 800 34px/1 'Baloo 2', system-ui, sans-serif; box-shadow: 0 4px 0 #4b2382, 0 6px 14px rgba(0,0,0,.25);
    cursor: pointer; display: flex; align-items: center; justify-content: center; padding-bottom: 4px; }
  .fab.back { left: 14px; }
  .fab.again { right: 14px; font-size: 28px; padding-bottom: 0; }
  .fab.pulse { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.15); } }
  .next { position: fixed; right: 14px; bottom: max(16px, env(safe-area-inset-bottom)); background: #ff8a1f; color: #fff; border: 4px solid #fff;
    border-radius: 999px; font: 800 24px/1 'Baloo 2', system-ui, sans-serif; padding: 12px 24px 14px; box-shadow: 0 4px 0 #b85a0c, 0 6px 14px rgba(0,0,0,.25); cursor: pointer; }
  .next.pulse { animation: pulse 1.1s ease-in-out infinite; }
  .card.fin { max-width: 560px; }
  .thumbs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 14px; }
  .thumbs img { width: 100%; aspect-ratio: 1; object-fit: contain; background: #fff; border: 2px solid #e8d9c4; border-radius: 12px; }
</style>
</head>
<body>
<div class="stage"><div class="frame" id="frame">
  <div class="txt"><div class="big" id="hr"></div><div class="es" id="es"></div><div class="say">se dice: <b id="say"></b></div></div>
  <div class="logo"></div>
</div></div>
<button class="fab back" id="back" aria-label="Volver al libro">←</button>
<button class="fab again" id="again" aria-label="Escuchar otra vez">🔊</button>
<button class="next" id="next">Siguiente ➜</button>

<div class="overlay" id="tap"><div class="card">
  <h2>🔊 Toca para escuchar</h2>
  <button class="btn" id="play">▶ Escuchar</button>
</div></div>

<div class="overlay" id="fin"><div class="card fin">
  <h2>¡Bravo! 🎉</h2>
  <p>Aprendiste las 12 palabras.<br>Ahora vuelve al libro: al final te esperan el <b>laberinto</b>, los <b>juegos</b> y los <b>dibujos para pintar</b> 🖍️</p>
  <div class="thumbs"><img src="img/m-rubia.jpg" alt=""><img src="img/c-bundeva.jpg" alt=""><img src="img/c-sismis.jpg" alt=""><img src="img/c-pauk.jpg" alt=""></div>
  <button class="btn" id="finback">← Volver al libro</button>
</div></div>

<audio id="aud" preload="auto"></audio>
<script>
  var W = {
    bundeva: ["bundeva", "la calabaza", "bun-de-va"], vjestica: ["vještica", "la bruja", "vies-ti-tsa"],
    duh: ["duh", "el fantasma", "duj"], sismis: ["šišmiš", "el murciélago", "shish-mish"],
    pauk: ["pauk", "la araña", "pa-uk"], paucina: ["paučina", "la telaraña", "pa-u-chi-na"],
    maska: ["maska", "la máscara", "mas-ka"], lubanja: ["lubanja", "la calavera", "lu-ba-ña"],
    slatkisi: ["slatkiši", "los dulces", "slat-ki-shi"], kostim: ["kostim", "el disfraz", "kos-tim"],
    metla: ["metla", "la escoba", "met-la"], svijeca: ["svijeća", "la vela", "svi-ie-cha"]
  };
  var KEYS = Object.keys(W), $ = function (id) { return document.getElementById(id); }, a = $("aud");
  var p = new URLSearchParams(location.search).get("p") || "bundeva";
  if (!W[p]) p = "bundeva";
  function show(k) {
    p = k; var w = W[p];
    $("frame").style.backgroundImage = "url('img/" + p + ".jpg')";
    $("hr").textContent = w[0]; $("es").textContent = w[1]; $("say").textContent = w[2];
    document.title = w[0] + " – " + w[1] + " · Rubia";
    a.src = "../audio/rubia/noc-vjestica/" + p + ".mp3";
    var last = KEYS.indexOf(p) === KEYS.length - 1;
    $("next").textContent = last ? "¡Terminamos! 🎉" : "Siguiente ➜";
    $("next").classList.remove("pulse");
    try { history.replaceState(null, "", "?p=" + p); } catch (e) {}
    var nx = KEYS[KEYS.indexOf(p) + 1];
    if (nx) { (new Image()).src = "img/" + nx + ".jpg"; }
  }
  show(p);
  $("next").onclick = function () {
    var i = KEYS.indexOf(p);
    if (i === KEYS.length - 1) { a.pause(); $("fin").classList.add("on"); return; }
    show(KEYS[i + 1]); play();
  };
  function goBack() {
    // Volver al libro: atrás si hay historial; si no, intentar cerrar la pestaña
    if (history.length > 1) { history.back(); }
    else { try { window.close(); } catch (e) {} }
  }
  function play() {
    $("tap").classList.remove("on"); $("back").classList.remove("pulse");
    a.currentTime = 0;
    var pr = a.play();
    if (pr && pr.catch) pr.catch(function () { $("tap").classList.add("on"); });
  }
  a.addEventListener("ended", function () { $("next").classList.add("pulse"); });
  $("play").onclick = play;
  $("again").onclick = play;
  $("back").onclick = goBack;
  $("finback").onclick = goBack;
  setTimeout(play, 500);
</script>
</body>
</html>
