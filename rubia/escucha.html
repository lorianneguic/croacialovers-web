<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Escucha con Rubia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #ffd9a8; font-family: 'Baloo 2', system-ui, sans-serif; color: #2b2340; overflow: hidden; }
  .stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  .frame { position: relative; width: min(100vw, 177.78vh); aspect-ratio: 16 / 9; background-size: cover; background-position: center; }
  .txt { position: absolute; left: 2%; top: 0; bottom: 0; width: 46%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding-bottom: 6%; }
  .big { font-weight: 800; font-size: min(9.4vw, 16.7vh); line-height: 1.05; color: #ff8a1f; -webkit-text-stroke: min(.9vw, 1.6vh) #4a2208; paint-order: stroke fill; text-shadow: 0 min(.7vw, 1.3vh) 0 #4a2208; }
  .es { font-weight: 700; font-size: min(4.4vw, 7.8vh); color: #1f2a5c; }
  .say { font-weight: 500; font-size: min(2.5vw, 4.4vh); color: #6b4a2a; }
  .say b { font-weight: 700; color: #2b2340; }
  .logo { position: absolute; left: 2%; bottom: 3%; width: 8.5%; aspect-ratio: 1; background: url('img/logo.png') center/contain no-repeat; }
  .overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(43,35,64,.45); padding: 16px; }
  .overlay.on { display: flex; }
  .card { background: #fffaf2; border-radius: 28px; padding: 26px 30px; text-align: center; max-width: 460px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
  .card h2 { font-weight: 800; font-size: 30px; color: #7b3fc4; line-height: 1.1; }
  .card p { font-size: 18px; margin-top: 8px; line-height: 1.35; }
  .btn { display: inline-flex; align-items: center; gap: 10px; margin-top: 16px; background: #7b3fc4; color: #fff; border: 4px solid #fff; border-radius: 999px;
    font: 700 22px 'Baloo 2', system-ui, sans-serif; padding: 10px 28px; box-shadow: 0 5px 0 #4b2382; cursor: pointer; }
  .arrow { display: inline-block; background: #7b3fc4; color: #fff; border-radius: 10px; padding: 0 10px; font-size: 22px; line-height: 1.3; }
  .btn.light { background: #fff; color: #7b3fc4; border-color: #7b3fc4; box-shadow: none; font-size: 18px; padding: 6px 20px; }
  .fab { position: fixed; top: max(14px, env(safe-area-inset-top)); width: 64px; height: 64px; border-radius: 50%; border: 4px solid #fff;
    background: #7b3fc4; color: #fff; font: 800 34px/1 'Baloo 2', system-ui, sans-serif; box-shadow: 0 4px 0 #4b2382, 0 6px 14px rgba(0,0,0,.25);
    cursor: pointer; display: flex; align-items: center; justify-content: center; padding-bottom: 4px; }
  .fab.back { left: 14px; }
  .fab.again { right: 14px; font-size: 28px; padding-bottom: 0; }
  .fab.pulse { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.15); } }
  .next { position: fixed; right: 14px; bottom: max(16px, env(safe-area-inset-bottom)); background: #ff8a1f; color: #fff; border: 4px solid #fff;
    border-radius: 999px; font: 800 24px/1 'Baloo 2', system-ui, sans-serif; padding: 12px 24px 14px; box-shadow: 0 4px 0 #b85a0c, 0 6px 14px rgba(0,0,0,.25); cursor: pointer; }
  .next.pulse { animation: pulse 1.1s ease-in-out infinite; }
  .card.fin { max-width: 560px; }
  .thumbs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 14px; }
  .thumbs img { width: 100%; aspect-ratio: 1; object-fit: contain; background: #fff; border: 2px solid #e8d9c4; border-radius: 12px; }
</style>
</head>
<body>
<div class="stage"><div class="frame" id="frame">
  <div class="txt"><div class="big" id="hr"></div><div class="es" id="es"></div><div class="say"><span id="saylbl">se dice:</span> <b id="say"></b></div></div>
  <div class="logo"></div>
</div></div>
<button class="fab again" id="again" aria-label="Escuchar otra vez">🔊</button>
<button class="next" id="next">Siguiente ➜</button>

<div class="overlay" id="tap"><div class="card">
  <h2 id="taph">🔊 Toca para escuchar</h2>
  <button class="btn" id="play">▶ Escuchar</button>
</div></div>

<div class="overlay" id="fin"><div class="card fin">
  <h2 id="finh">¡Bravo! 🎉</h2>
  <p id="finp">Aprendiste las 12 palabras.<br>Ahora abre tu <b>🎁 cuaderno de actividades</b> de regalo: <b>laberinto</b>, <b>juegos</b> y <b>dibujos para pintar</b> 🖍️</p>
  <div class="thumbs"><img src="img/m-rubia.jpg" alt=""><img src="img/c-bundeva.jpg" alt=""><img src="img/c-sismis.jpg" alt=""><img src="img/c-pauk.jpg" alt=""></div>
  <button class="btn" id="restart">🔁 Escuchar otra vez</button>
</div></div>

<audio id="aud" preload="auto"></audio>
<script>
  var BOOKS = {
    "noc-vjestica": { img: "img/", aud: "../audio/rubia/noc-vjestica/",
      thumbs: ["img/m-rubia.jpg", "img/c-bundeva.jpg", "img/c-sismis.jpg", "img/c-pauk.jpg"],
      es: { finp: "Aprendiste las 12 palabras.<br>Ahora abre tu <b>🎁 cuaderno de actividades</b> de regalo: <b>laberinto</b>, <b>juegos</b> y <b>dibujos para pintar</b> 🖍️" },
      en: { finp: "You learned all 12 words.<br>Now open your <b>🎁 free activity book</b>: <b>maze</b>, <b>games</b> and <b>coloring pages</b> 🖍️" },
      W: {
        bundeva: ["bundeva", "la calabaza", "bun-de-va", "pumpkin", "BOON-deh-vah"], vjestica: ["vještica", "la bruja", "vies-ti-tsa", "witch", "VYESH-tee-tsah"],
        duh: ["duh", "el fantasma", "duj", "ghost", "dookh"], sismis: ["šišmiš", "el murciélago", "shish-mish", "bat", "SHEESH-meesh"],
        pauk: ["pauk", "la araña", "pa-uk", "spider", "PAH-ook"], paucina: ["paučina", "la telaraña", "pa-u-chi-na", "spider web", "PAH-oo-chee-nah"],
        maska: ["maska", "la máscara", "mas-ka", "mask", "MAHS-kah"], lubanja: ["lubanja", "la calavera", "lu-ba-ña", "skull", "LOO-bah-nyah"],
        slatkisi: ["slatkiši", "los dulces", "slat-ki-shi", "candy", "SLAHT-kee-shee"], kostim: ["kostim", "el disfraz", "kos-tim", "costume", "KOS-teem"],
        metla: ["metla", "la escoba", "met-la", "broom", "MET-lah"], svijeca: ["svijeća", "la vela", "svi-ie-cha", "candle", "SVEE-yeh-chah"]
      } },
    "zivotinje": { img: "img/zivotinje/", aud: "../audio/rubia/zivotinje/",
      thumbs: ["img/zivotinje/macka.jpg", "img/zivotinje/zeko.jpg", "img/zivotinje/dupin.jpg", "img/zivotinje/pingvin.jpg"],
      es: { finp: "¡Aprendiste las 12 palabras de los animales!<br>Ahora abre tu <b>🎁 cuaderno de actividades</b> de regalo y sigue jugando con Rubia 🖍️" },
      en: { finp: "You learned all 12 animal words!<br>Now open your <b>🎁 free activity book</b> and keep playing with Rubia 🖍️" },
      W: {
        macka: ["mačka", "la gata", "mach-ka", "cat", "MAHCH-kah"], pas: ["pas", "el perro", "pas", "dog", "pahs"],
        krava: ["krava", "la vaca", "kra-va", "cow", "KRAH-vah"], dupin: ["dupin", "el delfín", "du-pin", "dolphin", "DOO-peen"],
        medvjed: ["medvjed", "el oso", "med-vied", "bear", "MED-vyed"], svinja: ["svinja", "la chancha", "svi-ña", "pig", "SVEE-nyah"],
        kokos: ["kokoš", "la gallina", "ko-kosh", "hen", "KOH-kosh"], zeko: ["zeko", "el conejito", "ze-ko", "bunny", "ZEH-koh"],
        riba: ["riba", "el pez", "ri-ba", "fish", "REE-bah"], konj: ["konj", "el caballo", "koñ", "horse", "kohny"],
        ptica: ["ptica", "el pájaro", "pti-tsa", "bird", "PTEE-tsah"], pingvin: ["pingvin", "el pingüino", "ping-vin", "penguin", "PEENG-veen"]
      } }
  };
  var Q = new URLSearchParams(location.search);
  var bookId = BOOKS[Q.get("b")] ? Q.get("b") : "noc-vjestica";
  var B = BOOKS[bookId];
  var isEN = Q.get("lang") === "en";
  var W = {};
  Object.keys(B.W).forEach(function (k) { var x = B.W[k]; W[k] = isEN ? [x[0], x[3], x[4]] : [x[0], x[1], x[2]]; });
  var TX = isEN ? { say: "say it:", next: "Next ➜", done: "All done! 🎉", tap: "🔊 Tap to listen", play: "▶ Listen", finh: "Bravo! 🎉",
      finp: B.en.finp, back: "🔁 Listen again" }
    : { say: "se dice:", next: "Siguiente ➜", done: "¡Terminamos! 🎉", finp: B.es.finp };
  document.getElementById("finp").innerHTML = TX.finp;
  var th = document.querySelectorAll(".thumbs img");
  for (var t = 0; t < th.length; t++) th[t].src = B.thumbs[t];
  if (isEN) {
    document.documentElement.lang = "en";
    document.getElementById("saylbl").textContent = TX.say;
    document.getElementById("taph").textContent = TX.tap; document.getElementById("play").textContent = TX.play;
    document.getElementById("finh").textContent = TX.finh;
    document.getElementById("restart").textContent = TX.back;
  }
  var KEYS = Object.keys(W), $ = function (id) { return document.getElementById(id); }, a = $("aud");
  var p = Q.get("p") || KEYS[0];
  if (!W[p]) p = KEYS[0];
  function show(k) {
    p = k; var w = W[p];
    $("frame").style.backgroundImage = "url('" + B.img + p + ".jpg')";
    $("hr").textContent = w[0]; $("es").textContent = w[1]; $("say").textContent = w[2];
    document.title = w[0] + " – " + w[1] + " · Rubia";
    a.src = B.aud + p + ".mp3";
    var last = KEYS.indexOf(p) === KEYS.length - 1;
    $("next").textContent = last ? TX.done : TX.next;
    $("next").classList.remove("pulse");
    try { history.replaceState(null, "", "?" + (bookId !== "noc-vjestica" ? "b=" + bookId + "&" : "") + "p=" + p + (isEN ? "&lang=en" : "")); } catch (e) {}
    var nx = KEYS[KEYS.indexOf(p) + 1];
    if (nx) { (new Image()).src = B.img + nx + ".jpg"; }
  }
  show(p);
  $("next").onclick = function () {
    var i = KEYS.indexOf(p);
    if (i === KEYS.length - 1) { a.pause(); $("fin").classList.add("on"); return; }
    show(KEYS[i + 1]); play();
  };
  function play() {
    $("tap").classList.remove("on");
    a.currentTime = 0;
    var pr = a.play();
    if (pr && pr.catch) pr.catch(function () { $("tap").classList.add("on"); });
  }
  a.addEventListener("ended", function () { $("next").classList.add("pulse"); });
  $("play").onclick = play;
  $("again").onclick = play;
  $("restart").onclick = function () { $("fin").classList.remove("on"); show(KEYS[0]); play(); };
  setTimeout(play, 500);
</script>
</body>
</html>
